<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__ · 3D model gallery</title>
<style>
:root{color-scheme:light;--ink:#152d2d;--muted:#506562;--deep:#19332f;--line:#ced7cc;--leaf:#46745f;--paper:#f7f7ee;--white:#fffef8;--sans:"Avenir Next","Segoe UI",system-ui,sans-serif;--serif:"Iowan Old Style","Baskerville","Georgia",serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font:16px var(--sans);color:var(--ink)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,canvas:focus-visible{outline:3px solid #bd622b;outline-offset:2px}header{background:var(--deep);color:#f7f6e7;padding:19px clamp(20px,4vw,64px);display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:4px solid #b7b88b}header h1{font:500 clamp(24px,2.3vw,38px)/1.1 var(--serif);margin:0;letter-spacing:-.025em}header span{font-size:14px;color:#d3ddc9}
main{max-width:1550px;margin:auto;padding:24px clamp(14px,3vw,48px) 22px;display:grid;grid-template-columns:minmax(252px,330px) minmax(0,1fr);gap:clamp(20px,3vw,48px);align-items:start}.shelf{border-right:1px solid var(--line);padding:2px 24px 0 0}.shelf h2{font:600 14px var(--sans);letter-spacing:.10em;text-transform:uppercase;margin:0 0 12px;color:#3b5750}.shelf section+section{margin-top:20px}.picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.sample{background:transparent;border:1px solid transparent;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;padding:2px 2px 6px;transition:background .15s,border-color .15s}.sample:hover{background:#e8eddf}.sample[aria-pressed=true]{background:#e0e9d8;border-color:#6e886a}.sample img{width:100%;aspect-ratio:1/.95;object-fit:contain;display:block}.sample span{font-size:13px;font-weight:550;white-space:nowrap}
article{min-width:0}.stage{position:relative;height:clamp(330px,55vh,640px);border:1px solid #bcccbf;border-radius:10px;background:radial-gradient(ellipse at 50% 58%,#f6f7ec 6%,#eaf0df 61%,#d7e4d4 100%);overflow:hidden;touch-action:none}.stage canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.stage canvas:active{cursor:grabbing}.stage #fallback{position:absolute;inset:0;margin:auto;height:94%;max-width:94%;object-fit:contain}.tools{position:absolute;top:12px;right:12px;display:flex;gap:4px}.tools button,.action{border:1px solid #aebfaf;background:#f9fbf2ed;border-radius:5px;padding:6px 10px;font-size:13px;font-weight:600}.tools button{min-width:32px;font-size:18px;line-height:1}.tools button:disabled,.action:disabled{opacity:.45;cursor:default}.action:hover,.tools button:hover{background:#e5eddf}.action[aria-pressed=true]{background:var(--deep);color:#fff}.under{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:10px 0 17px}.hint{font-size:13px;color:var(--muted)}.buttons{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.copy{border-top:1px solid #abbcae;padding-top:15px;display:grid;grid-template-columns:1fr auto;gap:5px 20px}.copy h2{font:500 clamp(36px,4vw,62px)/.95 var(--serif);letter-spacing:-.045em;margin:3px 0 4px}.role{font-size:16px;font-weight:650;margin:4px 0;color:#36594f}.influence{grid-column:2;grid-row:1/3;border-left:1px solid var(--line);padding:4px 0 4px 20px;max-width:210px;align-self:center;font-size:15px}.influence span{display:block;color:var(--muted);font-size:12px;letter-spacing:.045em;text-transform:uppercase;font-weight:650;margin-bottom:3px}.influence em{font-family:var(--serif);font-size:19px}.habit{grid-column:1/-1;max-width:640px;line-height:1.5;margin:7px 0 0;color:#344a45}.download{padding:0;border:0;background:transparent;color:#315e4f;font-weight:650;text-decoration:underline;text-underline-offset:3px;font-size:13px}.download:disabled{opacity:.55}
@media(max-width:900px){main{grid-template-columns:245px minmax(0,1fr);gap:18px}.shelf{padding-right:15px}.stage{height:clamp(315px,48vh,480px)}.under{align-items:flex-start;flex-direction:column}header{padding:14px 20px}.copy{grid-template-columns:1fr}.influence{grid-column:1;grid-row:4;max-width:none;border:0;padding:3px 0 0;display:flex;gap:8px;align-items:baseline}.influence em{font-size:16px}}
@media(max-width:655px){main{display:flex;flex-direction:column-reverse;gap:29px;padding-top:12px}article,.shelf{width:100%}.stage{height:clamp(272px,43svh,430px)}.shelf{padding:0;border-right:0}.shelf section{border-top:1px solid var(--line);padding-top:12px}.picker{grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}.sample span{font-size:11.5px}.under{align-items:center;flex-direction:row;margin-bottom:10px}.hint{font-size:12px}.copy h2{font-size:40px}.copy{padding-top:10px;gap:1px}.shelf section+section{margin-top:12px}.habit{font-size:15px}.buttons{gap:4px}.action{padding:5px 7px;font-size:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}.sample span{white-space:normal}.shelf{max-height:calc(100vh - 122px);overflow:auto;scrollbar-width:thin}.sample img{height:79px;width:100%}#search,#variant{font:inherit;font-size:14px;color:inherit;background:var(--white);border:1px solid #a5b7a7;border-radius:4px;padding:6px 9px}#search{width:100%;margin-bottom:13px}#variants{font-size:14px;display:block;margin:8px 0 12px}#variant{max-width:100%}
@media(max-width:655px){.shelf{max-height:420px}.picker{grid-template-columns:repeat(4,minmax(0,1fr))}.sample img{height:56px}}
</style></head><body>
<header><h1>__TITLE__</h1><span>3D model gallery</span></header>
<main><aside class="shelf" aria-label="Choose a character"><input type="search" id="search" aria-label="Search models" placeholder="Find a model…"><section><h2>Aliens</h2><div class="picker" id="aliens"></div></section><section><h2>Robots</h2><div class="picker" id="robots"></div></section></aside>
<article aria-labelledby="name"><div class="stage" id="stage"><canvas id="canvas" tabindex="0" aria-label="3D model. Drag or use arrow keys to rotate. Use plus and minus to zoom."></canvas><img hidden id="fallback" alt=""><div class="tools"><button id="out" aria-label="Zoom out" title="Zoom out">−</button><button id="in" aria-label="Zoom in" title="Zoom in">+</button></div></div>
<div class="under"><span id="hint" class="hint">Drag to rotate · Scroll to zoom</span><div class="buttons"><button id="spin" class="action" aria-pressed="false">Turntable</button><button id="reset" class="action">Reset view</button></div></div>
<label id="variants" hidden>Resident <select id="variant"></select></label><div class="copy" aria-live="polite"><h2 id="name"></h2><div class="influence"><span>Inspired by</span><em id="inspiration"></em></div><p class="role" id="role"></p><p class="habit" id="habit"></p></div>
<p><button class="download" id="download">Download this model (.glb)</button> &nbsp; <a hidden id="blend" class="download">Blender scene (.blend)</a></p>
</article></main>
<script type="application/json" id="pictures">__THUMBNAILS__</script>
<script>__BUNDLE__</script></body></html>
