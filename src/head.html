<title>Long Haul</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one full-bleed flight view; every overlay is a cockpit-glass panel docked to an edge. */
:root{
  color-scheme:dark;
  --void:#04060b; --glass:rgba(8,15,23,.86); --glass-2:rgba(18,30,42,.9);
  --line:#27475a; --ink:#dcedf3; --dim:#86a2ae;
  --amber:#ffb454; --cyan:#62e2ff; --good:#7dffa8; --bad:#ff6f61;
  --display:"Chakra Petch","Avenir Next Condensed","Trebuchet MS",sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --mono:"Share Tech Mono","SF Mono",Menlo,Consolas,monospace;
}
html,body{height:100%;overscroll-behavior:none}
@supports (height:100dvh){#app{height:100dvh}}
body{background:var(--void);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body:not(.touch) .touch-only,body.touch .kb-only{display:none!important}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.lb{position:absolute;left:0;right:0;height:0;background:#000;transition:height .7s ease;z-index:5;pointer-events:none}
#lb-top{top:0}#lb-bot{bottom:0}
.cine .lb{height:11%}
#cine-title{position:absolute;left:0;right:0;bottom:15%;text-align:center;z-index:6;pointer-events:none;opacity:0;transition:opacity 1s ease;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#cine-title.on{opacity:1}
#cine-title h2,#cine-title p{display:table;margin-left:auto!important;margin-right:auto!important;background:rgba(4,8,12,.72);border-radius:12px;padding:.12em .5em .16em .72em;-webkit-text-stroke:0}
#cine-title h2{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,58px);letter-spacing:.22em;margin:0;text-transform:uppercase;color:#f2f6fa;text-shadow:0 0 3px #000,0 2px 6px #000}
#cine-title p{font-family:var(--mono);color:var(--amber);letter-spacing:.3em;margin:.45em 0 0;text-transform:uppercase;font-size:clamp(20px,2.6vw,30px);text-shadow:0 0 3px #000,0 1px 4px #000}
#cine-title p:empty{display:none}
#skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(3% + env(safe-area-inset-bottom,0px));z-index:7;font-family:var(--mono);font-size:24px;letter-spacing:.2em;color:var(--dim);background:none;border:1px solid var(--line);padding:10px 20px;border-radius:2px}

#toasts{position:fixed;top:calc(7% + env(safe-area-inset-top,0px));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:8;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{font-family:var(--mono);font-size:28px;letter-spacing:.1em;line-height:1.25;text-align:center;text-transform:uppercase;padding:12px 26px;background:var(--glass);border:1px solid var(--line);border-left:3px solid var(--cyan);color:var(--ink);animation:toast 5s forwards;max-width:100%}
.toast.warn{border-left-color:var(--amber);color:var(--amber)}
.toast.good{border-left-color:var(--good);color:var(--good)}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}6%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#tooltip{position:absolute;z-index:9;pointer-events:none;font-family:var(--mono);font-size:24px;letter-spacing:.1em;background:var(--glass);border:1px solid var(--line);padding:8px 14px;white-space:nowrap;text-transform:uppercase}
#tooltip b{color:var(--amber);font-weight:400}
#keys{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:4;font-family:var(--mono);font-size:22px;letter-spacing:.14em;color:var(--dim);opacity:.85;pointer-events:none;text-transform:uppercase}

/* Title */
#title{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-start;overflow-y:auto;padding-block:min(6vh,56px);padding-left:max(6vw,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(90deg,rgba(2,4,8,.92) 0%,rgba(2,4,8,.55) 42%,rgba(2,4,8,0) 75%)}
#title .eyebrow{font-family:var(--mono);color:var(--amber);letter-spacing:.3em;font-size:22px;text-transform:uppercase}
#title>:first-child{margin-top:auto}
#title h1{font-family:var(--display);font-weight:700;font-size:clamp(54px,min(11vw,18vh),150px);line-height:.86;letter-spacing:.02em;margin:.12em 0 .16em;text-transform:uppercase}
#title h1 span{display:block;color:transparent;-webkit-text-stroke:1.5px var(--ink)}
#title .byline{font-family:var(--mono);font-size:24px;letter-spacing:.14em;color:var(--ink);margin:0 0 18px;opacity:.9}
#title .pitch{max-width:40ch;color:var(--dim);font-size:28px;line-height:1.5;margin:0 0 26px}
#title .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.big{font-family:var(--display);font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:26px;padding:18px 34px;background:var(--amber);color:#1a1206;border:0;border-radius:2px}
.big.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.big:hover{filter:brightness(1.15)}
#title dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,max-content));gap:8px 40px;margin:0;font-family:var(--mono);font-size:24px;letter-spacing:.08em;color:var(--dim);max-width:1500px}
#title dl div{display:flex;gap:12px;white-space:nowrap}#title dt{color:var(--cyan);min-width:7.5em}#title dd{margin:0}
#loading{font-family:var(--mono);color:var(--dim);letter-spacing:.2em;font-size:24px;text-transform:uppercase}

/* Port */
#bubble{position:absolute;z-index:14;left:0;top:0;max-width:min(460px,42vw);background:#f6f2e6;color:#1d1a14;border-radius:20px;padding:12px 18px 14px;transform:translate(-22%,calc(-100% - 22px));pointer-events:auto;cursor:pointer;border:3px solid #2a2116}
#bubble::after{content:'';position:absolute;left:22%;bottom:-19px;margin-left:-14px;border:14px solid transparent;border-top:18px solid #2a2116;border-bottom:0}
#bubble .who{font-family:var(--mono);font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:#6b5a44}#bubble .say{font-size:26px;line-height:1.3;margin-top:2px}#bubble .qk{font-size:17px;font-style:italic;color:#6b5a44;margin-top:6px}
#shelf-tip{position:absolute;z-index:16;pointer-events:none;background:rgba(6,10,14,.92);border:2px solid var(--amber);color:var(--ink);padding:10px 14px;font-size:22px;line-height:1.3;max-width:360px;transform:translate(16px,16px)}#shelf-tip b{color:var(--amber);display:block}#shelf-tip i{font-style:normal;color:var(--dim);font-size:18px}
@media (max-width:900px){ #bubble .say{font-size:19px}#bubble .who,#bubble .qk{font-size:14px} }
.pay{font-family:var(--mono);font-size:34px;color:var(--good);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{font-family:var(--display);font-size:24px;letter-spacing:.14em;text-transform:uppercase;padding:12px 22px;background:transparent;border:1px solid var(--cyan);color:var(--cyan);border-radius:2px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--cyan);color:#04121a}
.btn:disabled{border-color:var(--line);color:var(--dim);cursor:default}
.tag{display:inline-block;font-family:var(--mono);font-size:20px;letter-spacing:.14em;padding:2px 10px;border:1px solid var(--amber);color:var(--amber);margin-left:6px;vertical-align:middle}
.quote{display:grid;grid-template-columns:112px 1fr;gap:20px;align-items:start;padding:18px;border-left:3px solid var(--amber);background:var(--glass-2)}
.quote canvas{width:112px;height:112px;border:1px solid var(--line)}
.quote .who{font-family:var(--mono);font-size:22px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase}
.quote .alien{font-family:var(--mono);font-size:24px;color:var(--dim);font-style:italic;margin:5px 0}
.quote .say{font-size:30px;line-height:1.4}
.note{font-size:26px;color:var(--dim);line-height:1.45}
.ledger{font-family:var(--mono);font-size:26px;display:grid;grid-template-columns:1fr auto;gap:8px 22px;padding:18px;background:var(--glass-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.venue h3{font-family:var(--display);font-size:34px;letter-spacing:.08em;text-transform:uppercase;margin:4px 0 10px;color:var(--amber);line-height:1.1}
.quirk{font-size:24px;color:var(--dim);font-style:italic;margin:10px 0 2px;line-height:1.4}
.note.guide{border-top:1px solid var(--line);padding-top:12px;margin-top:6px}.note b{color:var(--ink);font-weight:500}
.ledger .tot{border-top:1px solid var(--line);padding-top:6px;color:var(--good)}

/* Comms */
#comms{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(4% + env(safe-area-inset-bottom,0px));width:min(1180px,calc(100% - 32px));z-index:12;background:var(--glass);border:1px solid var(--line);border-top:2px solid var(--cyan);padding:20px 22px;display:grid;grid-template-columns:160px 1fr;gap:22px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#comms canvas#comms-face{width:160px;height:160px;border:1px solid var(--line)}
#comms .who{font-family:var(--mono);font-size:24px;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase}
#comms-glyph{display:block;width:100%;height:44px;margin:6px 0}
#comms-text{font-size:32px;line-height:1.3;min-height:2.8em}
#comms-opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px}
.opt{font-family:var(--mono);font-size:24px;letter-spacing:.06em;padding:11px 16px;background:var(--glass-2);border:1px solid var(--line);color:var(--ink);border-radius:2px}
.opt:hover{border-color:var(--amber);color:var(--amber)}
.opt b{color:var(--amber);font-weight:400;margin-right:6px}

#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(4% + env(safe-area-inset-bottom,0px));width:min(1180px,calc(100% - 32px));z-index:28;background:var(--glass);border:1px solid var(--line);border-top:3px solid var(--amber);padding:20px 22px;display:grid;grid-template-columns:160px 1fr;gap:22px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#dlg.alert{border-top-color:var(--bad)}
#dlg-face{width:160px;height:160px;border:1px solid var(--line)}
#dlg .who{font-family:var(--mono);font-size:24px;letter-spacing:.12em;color:var(--amber);text-transform:uppercase}
#dlg.alert .who{color:var(--bad)}
#dlg-text{font-size:32px;line-height:1.3;margin-top:8px}
#dlg-time{height:6px;background:var(--glass-2);margin-top:12px}#dlg-bar{display:block;height:100%;width:0;background:var(--amber);transition:width .2s linear}
#dlg-opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px}
.opt small{display:block;color:var(--dim);font-size:20px;margin-top:4px;letter-spacing:.04em}
.opt:disabled{opacity:.45;cursor:default}
.tag.bad{border-color:var(--bad);color:var(--bad)}.tag.esc{border-color:var(--cyan);color:var(--cyan)}
.tag.r2{border-color:#ff9a4a;color:#ff9a4a}.tag.r3{border-color:#ff5a5a;color:#fff;background:#8a1c1c}
.risk{font-weight:700}.risk.r0{color:#7dffa8}.risk.r1{color:#ffd166}.risk.r2{color:#ff9a4a}.risk.r3{color:#ff6a6a}.warnf{color:#ff6a6a}
/* the top-left alert stack: the deep-space zone, then the port approach speed limit underneath */
#alerts{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));z-index:28;width:min(520px,calc(100vw - 32px));display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none}
#deep-badge{position:relative;font-family:var(--mono);font-size:22px;letter-spacing:.1em;text-transform:uppercase;background:var(--glass);border:1px solid;padding:6px 16px;pointer-events:none;white-space:nowrap}
#deep-badge.z1{color:#ffd166;border-color:#ffd166}#deep-badge.z2{color:#ff9a4a;border-color:#ff9a4a}#deep-badge.z3{color:#ff6a6a;border-color:#ff6a6a}
#deep-badge.storm{color:#fff;background:#a8322a;border-color:#ff7a6a;animation:scoopPulse 1s ease-in-out infinite}
@media (max-width:900px){ #deep-badge{font-size:16px} }
#help{position:absolute;inset:0;z-index:30;background:rgba(2,4,8,.88);display:flex;align-items:center;justify-content:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#help .box{max-width:1280px;width:100%;max-height:100%;overflow:auto;border:1px solid var(--line);background:var(--glass);padding:24px}
#help h2{font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;margin:0 0 14px;font-size:36px}
#help dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:10px 36px;font-family:var(--mono);font-size:25px;margin:0 0 16px}
#help dl div{display:flex;gap:16px}#help dt{color:var(--amber);min-width:7.5em}#help dd{margin:0;color:var(--ink)}
#map{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;background:rgba(2,5,10,.94)}
#map header{display:flex;align-items:center;gap:8px 22px;flex-wrap:wrap;padding:calc(14px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 12px max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
#map h2{font-family:var(--display);font-size:32px;letter-spacing:.2em;text-transform:uppercase;margin:0;line-height:1}
#map .sub{font-family:var(--mono);font-size:24px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;flex:1;min-width:0}
#map .sub b{color:var(--amber);font-weight:400}
#map-close{font-size:22px;padding:12px 22px}
#map-main{flex:1;min-height:0;display:flex}
#map-view{flex:1;min-width:0;position:relative}
#map-cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#map-side{width:500px;display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--glass)}
#map-search{margin:10px max(10px,env(safe-area-inset-right,0px)) 4px 10px;padding:12px 16px;font:26px var(--mono);letter-spacing:.04em;color:var(--ink);background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:2px;outline:none}
#map-search:focus{border-color:var(--cyan)}#map-search::placeholder{color:var(--dim)}
#map-list{flex:1;min-height:0;overflow:auto;padding:4px max(8px,env(safe-area-inset-right,0px)) 8px 8px;display:flex;flex-direction:column;gap:4px}
#map-list .none{font:22px var(--mono);color:var(--dim);padding:14px 10px;letter-spacing:.06em}
.mrow{display:grid;grid-template-columns:30px 1fr auto;gap:4px 14px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;border-radius:2px;padding:8px 10px;color:var(--ink);font:inherit}
.mrow:hover{background:var(--glass-2);border-color:var(--line)}
.mrow.tg{border-color:var(--amber);background:rgba(255,180,84,.08)}
.mrow i{width:28px;height:28px;border-radius:50%;grid-row:1/3}
.mrow .n{font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:28px}
.mrow.tg .n{color:var(--amber)}
.mrow .d{font-family:var(--mono);font-size:24px;color:var(--cyan);font-variant-numeric:tabular-nums}
.mrow .p{grid-column:2/4;font-family:var(--mono);font-size:22px;color:var(--dim);letter-spacing:.06em}
.mrow .b{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.mrow em{font-style:normal;font-family:var(--mono);font-size:20px;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border:1px solid var(--line);color:var(--dim)}
.mrow em.t{color:var(--amber);border-color:var(--amber)}.mrow em.c{color:var(--good);border-color:var(--good)}.mrow em.h{color:#1a1206;background:var(--amber);border-color:var(--amber)}
#map footer{font-family:var(--mono);font-size:22px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:10;transition:opacity .5s}
/* Touch controls (iPad): only on touch screens, only in flight */
#touch{display:none}
body.touch.flying #touch{display:block}
#t-left,#t-right{position:absolute;top:50%;transform:translateY(-46%);z-index:11;display:flex;gap:12px;pointer-events:none}
#t-left{left:max(18px,env(safe-area-inset-left,0px));flex-direction:column;align-items:center}
#t-right{right:max(18px,env(safe-area-inset-right,0px));align-items:stretch}
#t-left>*,#t-right>*{pointer-events:auto}
#t-stick{position:relative;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(98,226,255,.10) 0 38%,rgba(8,15,23,.55) 39%);border:3px solid rgba(98,226,255,.55);touch-action:none;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
#t-stick::before,#t-stick::after{content:"";position:absolute;background:rgba(98,226,255,.35);left:50%;top:14px;bottom:14px;width:2px;margin-left:-1px}
#t-stick::after{top:50%;left:14px;right:14px;bottom:auto;width:auto;height:2px;margin:-1px 0 0}
#t-knob{position:absolute;left:50%;top:50%;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#d9f7ff,#62e2ff 45%,#1b7f9b);border:3px solid #0b2a36;box-shadow:0 4px 10px rgba(0,0,0,.5);transition:transform .12s ease-out}
#t-stick.on #t-knob{transition:none}
.t-cap{font-family:var(--mono);font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);text-shadow:0 1px 4px #000}
.tb{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.1em;text-transform:uppercase;width:112px;height:70px;padding:0;background:rgba(8,15,23,.72);border:2px solid var(--cyan);color:var(--ink);border-radius:14px;touch-action:none;-webkit-user-select:none;user-select:none}
.tb:active{background:var(--cyan);color:#04121a}
.tb.lit{background:var(--amber);border-color:var(--amber);color:#1a1206}
.tb.wide{width:200px;height:60px;font-size:22px}
#t-btns{display:grid;grid-template-columns:repeat(2,112px);gap:10px}
#t-thr{position:relative;width:86px;border-radius:14px;background:rgba(8,15,23,.72);border:2px solid var(--amber);overflow:hidden;touch-action:none}
#t-fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,rgba(255,180,84,.85),rgba(255,180,84,.45));transition:height .1s}
#t-val{position:absolute;left:0;right:0;top:10px;text-align:center;font-family:var(--mono);font-weight:400;font-size:30px;color:var(--ink);text-shadow:0 1px 4px #000}
#t-thr span{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:var(--mono);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-shadow:0 1px 4px #000}
body.touch #keys{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);white-space:nowrap}
body.touch #title{background:linear-gradient(90deg,rgba(2,4,8,.94) 0%,rgba(2,4,8,.8) 55%,rgba(2,4,8,.3) 100%)}
body.touch #title dl{grid-template-columns:repeat(2,max-content)}
/* radio caption */
#caption{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(980px,calc(100% - 32px));z-index:9;background:var(--glass);border:1px solid var(--line);border-left:6px solid var(--cyan);padding:12px 20px;pointer-events:none}
#caption b{font-family:var(--mono);font-weight:400;font-size:24px;letter-spacing:.1em;text-transform:uppercase}
#caption span{margin-left:14px;font-family:var(--mono);font-size:20px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
#caption p{margin:4px 0 0;font-size:30px;line-height:1.3;color:var(--ink)}
body.cap #keys{display:none}
#caption p.off{color:var(--amber);font-family:var(--mono)}
/* portrait tablets: a little smaller so both clusters fit beside the view */
@media (max-aspect-ratio:1/1){
  #t-left,#t-right{top:auto;bottom:calc(30% + env(safe-area-inset-bottom,0px));transform:none}
