name: Build ship cockpits and walkable decks
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'art/cockpits/**.py'
      - 'art/ship-interiors/**.py'
      - '.github/workflows/ship-models.yml'
permissions: {}
jobs:
  fleet:
    permissions:
      contents: read
    if: github.event.pull_request.head.ref == 'bespoke-cockpits' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        ship: [rustbucket, dromedary, stoat, manatee, empress]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Blender 4.5 LTS
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          release=https://download.blender.org/release/Blender4.5
          archive=blender-4.5.3-linux-x64.tar.xz
          for mirror in "$release" https://ftp.halifax.rwth-aachen.de/blender/release/Blender4.5 https://mirrors.ocf.berkeley.edu/blender/release/Blender4.5; do
            curl -fsSL --retry 2 --output "$archive" "$mirror/$archive" && curl -fsSL --retry 2 --output checksums "$mirror/blender-4.5.3.sha256" && break
          done
          grep -F "$archive" checksums | sha256sum --check -
          tar -xf "$archive"
          echo "$RUNNER_TEMP/blender-4.5.3-linux-x64" >> "$GITHUB_PATH"
      - name: Build and render
        run: |
          blender --version
          for script in art/cockpits/${{ matrix.ship }}.py art/ship-interiors/${{ matrix.ship }}.py; do
            blender -b -t 4 --factory-startup --python-exit-code 1 --python "$script"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-${{ matrix.ship }}
          retention-days: 30
          path: |
            art/cockpits/${{ matrix.ship }}.blend
            art/ship-interiors/${{ matrix.ship }}.blend
            assets/cockpits
            assets/ship-interiors
            docs/cockpits/${{ matrix.ship }}/*.png
            docs/ship-interiors/${{ matrix.ship }}/*.png
