name: Build port interiors
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'art/interiors/**.py'
      - '.github/workflows/verdanthia-pilot.yml'
permissions: {}
jobs:
  pilot:
    permissions:
      contents: read
    if: github.event.pull_request.head.ref == 'bespoke-interiors' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        location: [verdanthia, scorchmaw, dunemoor, sloshwell, amethyne, toxibloom, candara, jovexa, brrrindle, listening-post-hush, cryo-vault-rimeholm, calibration-spire, beacon-far-wink]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Blender 4.5 LTS
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          release=https://download.blender.org/release/Blender4.5
          archive=blender-4.5.3-linux-x64.tar.xz
          for mirror in "$release" https://ftp.halifax.rwth-aachen.de/blender/release/Blender4.5 https://mirrors.ocf.berkeley.edu/blender/release/Blender4.5; do
            curl -fsSL --retry 2 --output "$archive" "$mirror/$archive" && curl -fsSL --retry 2 --output checksums "$mirror/blender-4.5.3.sha256" && break
          done
          grep -F "$archive" checksums | sha256sum --check -
          tar -xf "$archive"
          echo "$RUNNER_TEMP/blender-4.5.3-linux-x64" >> "$GITHUB_PATH"
      - name: Build and render
        run: |
          blender --version
          for script in art/interiors/${{ matrix.location }}/*.py; do
            blender -b -t 4 --factory-startup --python-exit-code 1 --python "$script"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: interiors-${{ matrix.location }}
          retention-days: 30
          path: |
            art/interiors/${{ matrix.location }}/*.blend
            assets/interiors
            docs/interiors/${{ matrix.location }}/*.png
